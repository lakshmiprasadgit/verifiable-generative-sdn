# Verification shield settings (paper Sec 2.3) and the components its projected
# rollout uses: nominal model T-hat, demand forecast d-bar, fallback pi_0 (Eqs 12-14).

measurements:
  # A measured value older than this (relative to the shield's current time) is
  # stale and makes the safety status UNKNOWN -> reject. Two control slots.
  max_staleness_s: 2.0

# Also require c(s-hat, a-hat) <= 0 at every rollout step k = 1..H.
# Paper Eq 17 only requires k = 0; true is stricter.
check_constraints_along_rollout: true

demand_forecast:
  type: upper_bound_constant   # d-bar_{t+k} = (1 + margin) * d_t
  margin: 0.2

nominal_model:
  # Parameters are NOT calibrated against the emulated network yet (Milestone 3).
  calibration_status: uncalibrated
  mean_packet_size_bytes: {urllc: 64, embb: 1514, mmtc: 100}   # Ethernet frame bytes; all rates are frame rates
  processing_delay_ms_per_hop: 0.05
  latency_safety_factor: 1.5
  max_valid_utilization: 0.95
  link_idle_power_w: 1.0
  link_dynamic_power_w: 2.0

# Fallback policy pi_0 (Eq 13): "static" applies fallback_action in every state;
# "capacity_aware" starts from it and moves/shrinks the eMBB reservation to fit the
# measured background load. See src/vgcp/models/fallback.py and docs/DECISIONS.md.
fallback_policy: capacity_aware

# Eq 42 selection (controller mode "shielded-utility"): among certified candidates,
# maximize sum_{k=0..H} gamma^k U over the shield's own rollout, with the Eq 27 utility
# U = qos*Q + energy*E + robustness*min rho - cost*C (terms in src/vgcp/loop/selection.py,
# extension D20). Weights and scales are illustrative, not tuned. The "shielded" mode
# keeps the first-certified rule and ignores this block.
selection:
  discount_gamma: 0.9
  weights: {qos: 1.0, energy: 0.1, robustness: 1.0, cost: 0.5}
  scales: {qos_mbps: 100.0, energy_w: 10.0, cost_mbps: 100.0}

# Base fallback action (the static pi_0). Must be in A (checked at load).
# Assumption 3 (recursive feasibility) is NOT yet established; Milestone 4.
fallback_action:
  path: {urllc: A, embb: B, mmtc: C}
  rate_budget_mbps: {urllc: 5.0, embb: 100.0, mmtc: 5.0}
  admission_limit: {urllc: 50, embb: 20, mmtc: 500}
  link_power: {l14: true, l46: true, l65: true}
